name: Application foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARATA_ENV_FILE: .env.compose.local
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run foundation:init-env && npm run db:compose:init
      - run: docker compose --env-file .env.compose.local -f compose.database.yaml config --quiet
      - run: docker compose --env-file .env.compose.local -f compose.database.yaml up -d --wait
      - run: npm run db:compose:provision && npm run db:migrate:deploy && npm run db:migrate:test && npm run db:grant:dev
      - run: docker compose --env-file .env.compose.local --env-file .env.foundation.local -f compose.foundation.yaml config --quiet
      - run: docker compose --env-file .env.compose.local --env-file .env.foundation.local -f compose.foundation.yaml up -d --wait postgres redis
      - run: npm run foundation:check
      - run: npm run db:verify && npm run db:test
      - run: |
          python3 -m venv .venv-contract
          .venv-contract/bin/python -m pip install --disable-pip-version-check -r api/requirements-contract.txt
          .venv-contract/bin/python api/validate_contracts.py
          .venv-contract/bin/python -m pytest -q api/tests
      - run: npx playwright install --with-deps chromium && npm run test:e2e
      - run: npm audit --audit-level=high
      - run: npm sbom --package-lock-only --omit=optional --sbom-format=cyclonedx > "$RUNNER_TEMP/arata-foundation-sbom.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arata-foundation-sbom
          path: ${{ runner.temp }}/arata-foundation-sbom.cdx.json
          retention-days: 30
      - run: docker compose --env-file .env.compose.local --env-file .env.foundation.local -f compose.foundation.yaml build api worker web
      - if: always()
        run: docker compose --env-file .env.compose.local --env-file .env.foundation.local -f compose.foundation.yaml down --volumes --remove-orphans || true
