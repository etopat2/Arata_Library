name: arata-techlibrary-dev

include:
  - compose.database.yaml

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"
  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.foundation
    command: ["node", "infrastructure/scripts/container-start.mjs", "api"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run database Compose provisioning first}
      HEALTH_TOKEN: ${HEALTH_TOKEN:?Run foundation init first}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?Run foundation init first}
      AUTH_DATA_KEY: ${AUTH_DATA_KEY:?Run foundation init first}
      REDIS_URL: redis://redis:6379
      AUTH_SMTP_HOST: mailpit
      AUTH_SMTP_PORT: 1025
      WEB_ORIGIN: http://127.0.0.1:5173
      API_HOST: 0.0.0.0
      STUDIO_STORAGE_ROOT: /app/.private-objects
    volumes:
      - studio_objects:/app/.private-objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
  worker:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.foundation
    command: ["node", "infrastructure/scripts/container-start.mjs", "worker"]
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL:?Run database Compose provisioning first}
      STUDIO_STORAGE_ROOT: /app/.private-objects
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
    volumes:
      - studio_objects:/app/.private-objects
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
  clamav:
    image: clamav/clamav:1.5
    environment:
      CLAMD_CONF_StreamMaxLength: 200M
      CLAMD_CONF_MaxFileSize: 200M
      CLAMD_CONF_MaxScanSize: 400M
      CLAMD_CONF_AlertExceedsMax: "yes"
    volumes:
      - clamav_data:/var/lib/clamav
  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.foundation
    command: ["npm", "run", "preview", "-w", "@arata/web-pwa", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:5173:5173"
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  redis_data:
  studio_objects:
  clamav_data:
