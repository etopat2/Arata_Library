name: arata-techlibrary-dev

include:
  - compose.database.yaml

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"
  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.foundation
    command: ["node", "infrastructure/scripts/container-start.mjs", "api"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run database Compose provisioning first}
      HEALTH_TOKEN: ${HEALTH_TOKEN:?Run foundation init first}
      WEB_ORIGIN: http://127.0.0.1:5173
      API_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
  worker:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.foundation
    command: ["node", "infrastructure/scripts/container-start.mjs", "worker"]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.foundation
    command: ["npm", "run", "preview", "-w", "@arata/web-pwa", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  redis_data:
